services:
  # ── Backend (FastAPI + yt-dlp) ──────────────────────────────────────────────
  - type: web
    name: vidget-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: ALLOWED_ORIGINS
        # Update to your Vercel deployment URL, e.g. https://vidget.vercel.app
        value: https://vidget.vercel.app
      - key: TEMP_DIR
        value: /tmp/downloads
      - key: MAX_FILE_SIZE_MB
        value: 100
      - key: MAX_DURATION_SECONDS
        value: 600
      - key: DOWNLOAD_TIMEOUT_SECONDS
        value: 120
      - key: MAX_CONCURRENT_DOWNLOADS
        value: 1
      - key: FILE_TTL_SECONDS
        value: 300