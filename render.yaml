services:
  # ── Backend (FastAPI + yt-dlp) ──────────────────────────────────────────────
  - type: web
    name: vidget-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: ALLOWED_ORIGINS
        # Update to your Vercel deployment URL, e.g. https://vidget.vercel.app
        value: https://vidget.vercel.app
      - key: TEMP_DIR
        value: /tmp/downloads
      - key: MAX_FILE_SIZE_MB
        value: 100
      - key: MAX_DURATION_SECONDS
        value: 600
      - key: DOWNLOAD_TIMEOUT_SECONDS
        value: 120
      - key: MAX_CONCURRENT_DOWNLOADS
        value: 1
      - key: FILE_TTL_SECONDS
        value: 300
      # ── yt-dlp anti-bot (YouTube) ──────────────────────────────────────────
      # Rotate through browser-like player clients to dodge bot detection.
      - key: YTDLP_PLAYER_CLIENTS
        value: android,ios,web_safari
      # Impersonate a real browser TLS fingerprint via curl_cffi.
      - key: YTDLP_IMPERSONATE
        value: chrome